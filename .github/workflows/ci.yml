name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - .github/workflows/install-scripts.yml
      - .github/workflows/release.yml
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - .github/workflows/install-scripts.yml
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job keeps its work between runs, so a run only redoes what changed:
# - Rust: Swatinem/rust-cache keeps the registry and the compiled dependencies, keyed on
#   Cargo.lock. Crates are checked against Cargo.lock's checksums when they are downloaded, so
#   a cache can only hold what the lock file names. Only main saves caches; pull requests
#   restore main's and leave the cache budget alone.
# - System libraries: cache-apt-pkgs keeps the .deb files instead of running apt each time.
# - Changes to documentation alone run nothing.
# Pull requests run the Linux checks, plus the driver tests when the data layer changed; pushes
# to main and manual runs also check Windows, the minimum Rust version and the release builds,
# whose cache the release workflow then reuses.

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"Linux","os":"ubuntu-22.04"}]' || '[{"name":"Linux","os":"ubuntu-22.04"},{"name":"Windows","os":"windows-latest"}]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libgbm-dev libclang-dev
          version: "1"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: Minimum Rust version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libgbm-dev libclang-dev
          version: "1"

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo check --workspace --locked

  changes:
    name: What changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - crates/deltos-data/**
              - crates/deltos-drivers/**
              - Cargo.lock
              - .github/workflows/ci.yml

  drivers:
    name: Drivers against live databases
    needs: changes
    # On pull requests only when the data layer changed; always on main.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.data == 'true') }}
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deltos
          POSTGRES_PASSWORD: deltos
          POSTGRES_DB: deltos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deltos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: deltos
          MYSQL_PASSWORD: deltos
          MYSQL_DATABASE: deltos
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: deltos
          MARIADB_PASSWORD: deltos
          MARIADB_DATABASE: deltos
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DELTOS_TEST_POSTGRES_URL: postgres://deltos:deltos@localhost:5432/deltos
      DELTOS_TEST_MYSQL_URL: mysql://root:root@localhost:3306/deltos
      DELTOS_TEST_MARIADB_URL: mysql://root:root@localhost:3307/deltos
      DELTOS_TEST_MONGODB_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: drivers
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Test the drivers
        run: cargo test -p deltos-drivers --locked

  build:
    name: Build (${{ matrix.platform.name }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-22.04, binary: target/release/deltos }
          - { name: Windows, os: windows-latest, binary: target/release/deltos.exe }
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libgbm-dev libclang-dev
          version: "1"

      - uses: dtolnay/rust-toolchain@stable

      # The release workflow restores this same cache, so a release rebuilds only Deltos'
      # own crates.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo build --release --locked -p deltos

      - uses: actions/upload-artifact@v4
        with:
          name: deltos-${{ runner.os }}
          path: ${{ matrix.platform.binary }}
          if-no-files-found: error
          retention-days: 14
