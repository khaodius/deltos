[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/khaodius/deltos"
authors = ["khaodius"]
publish = false

[workspace.dependencies]
deltos-data = { path = "crates/deltos-data" }
deltos-dock = { path = "crates/deltos-dock" }
deltos-drivers = { path = "crates/deltos-drivers" }
deltos-grid = { path = "crates/deltos-grid" }
deltos-settings = { path = "crates/deltos-settings" }
deltos-updater = { path = "crates/deltos-updater" }

anyhow = "1"
async-channel = "2"
directories = "6"
futures = "0.3"
gpui = "=0.2.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "allow"
# View code builds elements with many inputs; splitting them only moves the noise.
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"

# libc no longer exports ENOATTR on Linux, which breaks xattr 0.2, an indirect dependency
# of gpui through its tar reader. third_party/xattr is the published crate with that one
# constant defined. Drop this once gpui moves to xattr 1.
[patch.crates-io]
xattr = { path = "third_party/xattr" }
