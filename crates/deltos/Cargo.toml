[package]
name = "deltos"
description = "A fast, native database client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "deltos"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
deltos-data.workspace = true
deltos-dock.workspace = true
deltos-drivers.workspace = true
deltos-grid.workspace = true
deltos-settings.workspace = true
deltos-updater.workspace = true
futures.workspace = true
gpui.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation = "1.12"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "deltos"
maintainer = "khaodius <72529959+khaodius@users.noreply.github.com>"
copyright = "khaodius"
license-file = ["../../LICENSE", "0"]
extended-description = "Deltos is a native database client for PostgreSQL, MySQL, MariaDB, SQLite and MongoDB, written in Rust with GPUI."
section = "database"
priority = "optional"
depends = "$auto, libvulkan1"
assets = [
    ["target/release/deltos", "usr/bin/", "755"],
    ["../../packaging/linux/deltos.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/png/deltos-16.png", "usr/share/icons/hicolor/16x16/apps/deltos.png", "644"],
    ["../../assets/icons/png/deltos-24.png", "usr/share/icons/hicolor/24x24/apps/deltos.png", "644"],
    ["../../assets/icons/png/deltos-32.png", "usr/share/icons/hicolor/32x32/apps/deltos.png", "644"],
    ["../../assets/icons/png/deltos-48.png", "usr/share/icons/hicolor/48x48/apps/deltos.png", "644"],
    ["../../assets/icons/png/deltos-64.png", "usr/share/icons/hicolor/64x64/apps/deltos.png", "644"],
    ["../../assets/icons/png/deltos-128.png", "usr/share/icons/hicolor/128x128/apps/deltos.png", "644"],
    ["../../assets/icons/png/deltos-256.png", "usr/share/icons/hicolor/256x256/apps/deltos.png", "644"],
    ["../../assets/icons/png/deltos-512.png", "usr/share/icons/hicolor/512x512/apps/deltos.png", "644"],
]

[package.metadata.generate-rpm]
name = "deltos"
summary = "A fast, native database client"
license = "Apache-2.0"
assets = [
    { source = "target/release/deltos", dest = "/usr/bin/deltos", mode = "755" },
    { source = "packaging/linux/deltos.desktop", dest = "/usr/share/applications/deltos.desktop", mode = "644" },
    { source = "assets/icons/png/deltos-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/deltos.png", mode = "644" },
    { source = "assets/icons/png/deltos-24.png", dest = "/usr/share/icons/hicolor/24x24/apps/deltos.png", mode = "644" },
    { source = "assets/icons/png/deltos-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/deltos.png", mode = "644" },
    { source = "assets/icons/png/deltos-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/deltos.png", mode = "644" },
    { source = "assets/icons/png/deltos-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/deltos.png", mode = "644" },
    { source = "assets/icons/png/deltos-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/deltos.png", mode = "644" },
    { source = "assets/icons/png/deltos-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/deltos.png", mode = "644" },
    { source = "assets/icons/png/deltos-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/deltos.png", mode = "644" },
]
auto-req = "auto"
