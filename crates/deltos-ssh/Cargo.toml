[package]
name = "deltos-ssh"
description = "SSH tunnels in front of Deltos database connections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
data-encoding = "2"
deltos-data.workspace = true
directories.workspace = true
futures.workspace = true
hmac = "0.13"
# 0.64 needs Rust 1.89. The ring backend builds with a plain C compiler everywhere, where
# the default aws-lc-rs needs CMake and NASM on Windows.
russh = { version = "=0.63.0", default-features = false, features = ["ring", "rsa", "flate2"] }
sha1 = "0.11"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
